name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # имена могут быть VITE_* или NEXT_PUBLIC_* (так их предлагает сам Supabase),
  # лежать могут как в Variables, так и в Secrets
  SB_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SB_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли переменные Supabase
        run: |
          echo "URL длиной: ${#SB_URL} символов"
          echo "KEY длиной: ${#SB_KEY} символов"
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::error::Переменные Supabase не найдены. Settings → Secrets and variables → Actions: добавьте NEXT_PUBLIC_SUPABASE_URL и NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # strict-dep-builds=false: сборка esbuild нам не нужна (бинарник едет в @esbuild/* пакете)
      - run: pnpm install --no-frozen-lockfile --config.strict-dep-builds=false

      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ env.SB_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SB_KEY }}

      - name: Проверка, что адрес вшит в бандл
        if: always()
        run: |
          if grep -rqF "$SB_URL" dist/assets/*.js; then
            echo "Supabase вшит в бандл: да"
          else
            echo "::error::Адрес Supabase не попал в собранный бандл"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
