name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # strict-dep-builds=false: сборка esbuild нам не нужна (бинарник едет в @esbuild/* пакете)
      - run: pnpm install --no-frozen-lockfile --config.strict-dep-builds=false

      # адрес и publishable-ключ Supabase лежат в app/.env.production
      - run: pnpm build

      - name: Проверка, что адрес Supabase вшит в бандл
        run: |
          url=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          if grep -qF "$url" dist/assets/*.js; then
            echo "Supabase в бандле: $url"
          else
            echo "::error::Адрес Supabase из .env.production не попал в собранный бандл"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
