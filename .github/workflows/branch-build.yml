name: Branch build

# Проверка сборки ветки firebase без деплоя (сайт остаётся на main).
on:
  push:
    branches: [firebase]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --no-frozen-lockfile --config.strict-dep-builds=false
        working-directory: app
      - name: Build
        run: pnpm build
        working-directory: app
